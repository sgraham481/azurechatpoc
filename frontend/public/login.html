<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Executive Command Center</title>
    <style>
      :root { color-scheme: light; }
      body { margin:0; min-height:100vh; display:grid; place-items:center;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             background:#f4f6fb; color:#1b2a5e; }
      .card { background:#fff; padding:40px 44px; border-radius:14px; max-width:380px;
              box-shadow:0 10px 40px rgba(27,42,94,.10); text-align:center; }
      h1 { font-size:20px; margin:0 0 8px; }
      p  { font-size:14px; line-height:1.55; color:#5a6488; margin:0 0 26px; }
      a  { display:block; padding:11px 18px; margin:9px 0; border-radius:8px;
           text-decoration:none; font-size:14px; font-weight:600; border:1px solid #d7dcec; color:#1b2a5e; }
      a:hover { background:#f4f6fb; }
      .note { font-size:12px; color:#8a92ad; margin:22px 0 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Executive Command Center</h1>
      <p>This preview is restricted to invited accounts. Sign in to continue.</p>
      <a href="/.auth/login/aad?post_login_redirect_uri=/">Sign in with Microsoft</a>
      <a href="/.auth/login/github?post_login_redirect_uri=/">Sign in with GitHub</a>
      <p class="note">Signing in does not grant access on its own — your account must also have been invited.</p>
    </div>
  </body>
</html>
