<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access needed · Executive Command Center</title>
    <style>
      :root { color-scheme: light; }
      body { margin:0; min-height:100vh; display:grid; place-items:center;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             background:#f4f6fb; color:#1b2a5e; }
      .card { background:#fff; padding:40px 44px; border-radius:14px; max-width:400px;
              box-shadow:0 10px 40px rgba(27,42,94,.10); text-align:center; }
      h1 { font-size:20px; margin:0 0 8px; }
      p  { font-size:14px; line-height:1.6; color:#5a6488; margin:0 0 20px; }
      a  { font-size:13px; color:#4f46e5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're signed in, but not invited</h1>
      <p>
        Your account authenticated successfully, but it hasn't been granted access to this
        preview. Ask the owner to send you an invitation, then sign in again.
      </p>
      <a href="/logout">Sign out and try another account</a>
    </div>
  </body>
</html>
